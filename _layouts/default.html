<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="theme-color" content="#102d54">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/social.png' | absolute_url }}">
    <meta property="og:image:alt" content="Prof. Elias Sabát — Aulas particulares e materiais de Química">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <script src="{{ '/assets/js/catalog.js' | relative_url }}" defer></script>
    <title>{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">Q</span><span>Prof. Elias Sabát<small>Aulas particulares de Química</small></span></a>
      <nav aria-label="Navegação principal">
        <a href="#quem-sou-eu">Quem sou eu</a>
        <a href="#apostilas">Apostilas</a>
        <a href="#aulas">Aulas particulares</a>
        <a href="#contato">Contato</a>
      </nav>
    </header>
    <main id="conteudo" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">Química • Prof. Elias Sabát · Belém–PA<br>Materiais de autoria do Prof. Elias Sabát. Direitos autorais reservados.</footer>
  </body>
</html>
